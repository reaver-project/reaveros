name: Publish build environment

on:
    workflow_call:
        inputs:
            content_tag:
                description: Validated content-derived cache tag
                required: true
                type: string

permissions:
    contents: read

jobs:
    publish:
        name: Publish validated images to GHCR
        if: github.event_name != 'pull_request_target' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        runs-on: ubuntu-latest
        timeout-minutes: 30

        permissions:
            contents: read
            id-token: write # Authenticate to the read-only AWS image role.
            packages: write # Copy validated images into GHCR.

        steps:
          - name: Check out the publication helper
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                persist-credentials: false

          - name: Read the AWS infrastructure contract
            id: stack
            uses: reaver-project/infrastructure/actions/aws-stack-contract@351d6eef21c212ba653d5b7179cbbab6e93856ac
            with:
                aws-region: ${{ vars.AWS_REGION }}
                expected-contract-version: '2'
                role-arn: ${{ vars.AWS_RUNNER_ROLE_ARN }}
                role-session-name: reaveros-${{ github.run_id }}-publish
                stack-name: ${{ vars.AWS_RUNNER_STACK_NAME }}

          - name: Install the registry copy client
            run: |
                sudo apt-get update
                sudo apt-get install --yes skopeo

          - name: Publish the validated content tag and latest
            env:
                AWS_REGION: ${{ vars.AWS_REGION }}
                BUILD_ENVIRONMENT: ${{ fromJSON(steps.stack.outputs.outputs).BuildEnvironmentRepositoryUri }}
                CONTENT_TAG: ${{ inputs.content_tag }}
                GHCR_TOKEN: ${{ github.token }}
                UNPRUNED_BUILD_ENVIRONMENT: ${{ fromJSON(steps.stack.outputs.outputs).UnprunedBuildEnvironmentRepositoryUri }}
            run: |
                ./ci/aws/publish-build-environment \
                    "${BUILD_ENVIRONMENT}" \
                    "${UNPRUNED_BUILD_ENVIRONMENT}" \
                    ghcr.io/reaver-project/reaveros-build-env \
                    ghcr.io/reaver-project/reaveros-build-env/unpruned \
                    "${CONTENT_TAG}"
