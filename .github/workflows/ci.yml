name: CI

permissions:
    contents: read

on:
    push:
        branches:
          - main
          - pull-request/*
    schedule:
      - cron: '0 4 * * 0'
    workflow_dispatch:
        inputs:
            refresh_build_environment:
                description: Refresh the container operating system before validation
                default: false
                required: false
                type: boolean

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    authorize:
        name: Authorize AWS CI
        runs-on: ubuntu-latest
        timeout-minutes: 5

        permissions:
            contents: read
            pull-requests: read

        outputs:
            approved: ${{ steps.authorize.outputs.approved }}
            publish_cache: ${{ steps.authorize.outputs.publish_cache }}
            pull_request_number: ${{ steps.authorize.outputs.pull_request_number }}
            reason: ${{ steps.authorize.outputs.reason }}
            refresh_cache: ${{ steps.authorize.outputs.refresh_cache }}
            source_ref: ${{ steps.authorize.outputs.source_ref }}
            source_repository: ${{ steps.authorize.outputs.source_repository }}
            source_sha: ${{ steps.authorize.outputs.source_sha }}

        steps:
          - name: Check out trusted authorization policy
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                ref: ${{ github.event.repository.default_branch }}
                persist-credentials: false

          - name: Test the trusted CI policy
            run: |
                ./ci/aws/test-authorize
                ./ci/aws/test-promote-build-environment
                ./ci/aws/test-publish-build-environment
                ./ci/aws/test-select-infrastructure-contract
                ./ci/aws/test-workflows
                ./ci/test-build-image

          - name: Evaluate AWS CI policy
            id: authorize
            env:
                GH_TOKEN: ${{ github.token }}
                REAVEROS_CI_GATE_APP_SLUG: ${{ vars.CI_GATE_APP_SLUG }}
            run: ./ci/aws/authorize

          - name: Summarize authorization
            env:
                APPROVED: ${{ steps.authorize.outputs.approved }}
                REASON: ${{ steps.authorize.outputs.reason }}
                SOURCE_REF: ${{ steps.authorize.outputs.source_ref }}
                SOURCE_SHA: ${{ steps.authorize.outputs.source_sha }}
            run: |
                {
                    printf '## AWS CI authorization\n\n'
                    printf -- '- Approved: `%s`\n' "${APPROVED}"
                    printf -- '- Reason: %s\n' "${REASON}"
                    printf -- '- Source: `%s` (`%s`)\n' "${SOURCE_REF}" "${SOURCE_SHA}"
                } >> "${GITHUB_STEP_SUMMARY}"

    infrastructure-contract:
        name: Validate infrastructure consumer
        if: needs.authorize.outputs.approved == 'true'
        needs: authorize
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            contents: read
            pull-requests: read

        steps:
          - name: Check out the trusted consumer policy
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                ref: ${{ github.event.repository.default_branch }}
                path: trusted
                persist-credentials: false

          - name: Check out the requested revision without executing it
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                repository: ${{ needs.authorize.outputs.source_repository }}
                ref: ${{ needs.authorize.outputs.source_sha }}
                fetch-depth: 0
                path: candidate
                persist-credentials: false

          - name: Select the required infrastructure contract
            id: contract
            env:
                DEPLOYED_INFRASTRUCTURE_CONTRACT_VERSION: ${{ vars.AWS_INFRASTRUCTURE_CONTRACT_VERSION }}
                DEPLOYED_INFRASTRUCTURE_REVISION: ${{ vars.AWS_INFRASTRUCTURE_REVISION }}
                DEPLOYED_MAINTENANCE_APP_SLUG: ${{ vars.MAINTENANCE_APP_SLUG }}
                GH_TOKEN: ${{ github.token }}
                PULL_REQUEST_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
                SOURCE_REF: ${{ needs.authorize.outputs.source_ref }}
                SOURCE_REPOSITORY: ${{ needs.authorize.outputs.source_repository }}
                SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
            run: trusted/ci/aws/select-infrastructure-contract trusted

          - name: Validate the requested infrastructure consumer
            uses: reaver-project/infrastructure/actions/validate-infrastructure-consumer@dbb8a6039d586a37a3d1ec66627e35b3b3751656
            with:
                source-directory: ${{ github.workspace }}/candidate
                revision-file: ci/aws/infrastructure-revision
                contract-version-file: ci/aws/infrastructure-contract-version
                expected-revision: ${{ steps.contract.outputs.expected_revision }}
                contract-version: ${{ steps.contract.outputs.expected_contract_version }}
                base-revision: ${{ steps.contract.outputs.base_revision }}

    toolchain-update-state:
        name: Fail quickly on unresolved toolchain patch refresh
        if: needs.authorize.outputs.approved == 'true'
        needs:
          - authorize
          - infrastructure-contract
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
          - name: Check out the requested revision
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                repository: ${{ needs.authorize.outputs.source_repository }}
                ref: ${{ needs.authorize.outputs.source_sha }}
                persist-credentials: false

          - name: Validate toolchain update state
            run: |
                set -euo pipefail
                unresolved=0
                if [[ -d maintenance/update-state ]]
                then
                    for state_file in maintenance/update-state/*.state
                    do
                        if [[ ! -f ${state_file} ]]
                        then
                            continue
                        fi

                        status=$(awk -F= '/^status=/{ print $2 }' "${state_file}" | tail -n1)
                        unresolved_count=$(awk -F= '/^unresolved_count=/{ print $2 }' "${state_file}" | tail -n1)
                        failed_patch=$(awk -F= '/^failed_patch=/{ print $2 }' "${state_file}" | tail -n1)

                        if [[ ${status} == incomplete || ${unresolved_count} != 0 ]]
                        then
                            echo "::error file=${state_file}::Unresolved patch refresh detected (failed patch: ${failed_patch})."
                            unresolved=1
                        fi
                    done
                fi

                if [[ ${unresolved} -ne 0 ]]
                then
                    exit 1
                fi

    build-matrix:
        name: Compile CI matrix
        if: needs.authorize.outputs.approved == 'true'
        needs:
          - authorize
          - infrastructure-contract
          - toolchain-update-state
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            standalone: ${{ steps.matrix.outputs.standalone }}
            producer: ${{ steps.matrix.outputs.producer }}
            consumer: ${{ steps.matrix.outputs.consumer }}
            has_standalone: ${{ steps.matrix.outputs.has_standalone }}
            has_producer: ${{ steps.matrix.outputs.has_producer }}
            has_consumer: ${{ steps.matrix.outputs.has_consumer }}

        steps:
          - name: Check out the requested revision
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                repository: ${{ github.repository }}
                ref: ${{ github.sha }}
                persist-credentials: false

          - name: Install Python
            uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
            with:
                python-version: '3.13'

          - name: Install the YAML parser
            run: |
                python3 -m pip install \
                    --only-binary=:all: \
                    --require-hashes \
                    -r ci/matrix-requirements.txt

          - name: Test the candidate CI configuration
            run: |
                python3 -m unittest discover -s ci/matrix -p 'test_*.py'
                ./ci/aws/test-run-matrix-job
                ./ci/aws/test-workflows
                ./ci/test-build-image

          - name: Compile the requested matrix
            id: matrix
            run: python3 ci/matrix/compile.py ci/matrix.yaml --workflow ci

    build-environment:
        name: Prepare build environment (medium)
        if: needs.authorize.outputs.approved == 'true'
        needs:
          - authorize
          - infrastructure-contract
          - toolchain-update-state
          - build-matrix
        permissions:
            contents: read
        uses: ./.github/workflows/aws-runner.yml
        with:
            cache_tag: run-${{ github.run_id }}-${{ github.run_attempt }}
            defer_llvm: true
            refresh_cache: ${{ needs.authorize.outputs.refresh_cache == 'true' }}
            runner_size: medium
            task: prepare

    build-environment-large:
        name: Rebuild build environment (large)
        if: needs.build-environment.outputs.needs_large == 'true'
        needs:
          - authorize
          - build-environment
        permissions:
            contents: read
        uses: ./.github/workflows/aws-runner.yml
        with:
            cache_tag: run-${{ github.run_id }}-${{ github.run_attempt }}
            refresh_cache: ${{ needs.authorize.outputs.refresh_cache == 'true' }}
            runner_size: large
            task: prepare

    build-environment-ready:
        name: Build environment ready
        if: always() && needs.authorize.outputs.approved == 'true'
        needs:
          - authorize
          - build-environment
          - build-environment-large
        runs-on: ubuntu-latest
        timeout-minutes: 5
        outputs:
            cache_tag: ${{ steps.ready.outputs.cache_tag }}

        steps:
          - name: Check preparation result
            id: ready
            env:
                CACHE_TAG: run-${{ github.run_id }}-${{ github.run_attempt }}
                LARGE_READY: ${{ needs.build-environment-large.outputs.ready }}
                LARGE_RESULT: ${{ needs.build-environment-large.result }}
                MEDIUM_NEEDS_LARGE: ${{ needs.build-environment.outputs.needs_large }}
                MEDIUM_READY: ${{ needs.build-environment.outputs.ready }}
                MEDIUM_RESULT: ${{ needs.build-environment.result }}
            run: |
                set -euo pipefail
                if [[ ${MEDIUM_RESULT} != success ]]
                then
                    printf '::error::Medium build-environment preparation finished with %s.\n' "${MEDIUM_RESULT}"
                    exit 1
                fi

                if [[ ${MEDIUM_NEEDS_LARGE} == true ]]
                then
                    if [[ ${LARGE_RESULT} != success || ${LARGE_READY} != true ]]
                    then
                        printf '::error::Large build-environment preparation finished with %s.\n' "${LARGE_RESULT}"
                        exit 1
                    fi
                elif [[ ${MEDIUM_READY} != true ]]
                then
                    printf '::error::Medium preparation did not produce a build environment.\n'
                    exit 1
                fi

                printf 'cache_tag=%s\n' "${CACHE_TAG}" >> "${GITHUB_OUTPUT}"

    dispatch-standalone:
        name: ${{ matrix.name }}
        if: ${{ !cancelled() && needs.authorize.outputs.approved == 'true' && needs.build-environment-ready.result == 'success' && needs.build-matrix.outputs.has_standalone == 'true' }}
        needs:
          - authorize
          - build-matrix
          - build-environment-ready
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build-matrix.outputs.standalone) }}
        uses: ./.github/workflows/aws-runner.yml
        with:
            cache_tag: ${{ needs.build-environment-ready.outputs.cache_tag }}
            job_matrix: ${{ toJSON(matrix.job_matrix) }}
            task: dispatch

    dispatch-producers:
        name: ${{ matrix.name }}
        if: ${{ !cancelled() && needs.authorize.outputs.approved == 'true' && needs.build-environment-ready.result == 'success' && needs.build-matrix.outputs.has_producer == 'true' }}
        needs:
          - authorize
          - build-matrix
          - build-environment-ready
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build-matrix.outputs.producer) }}
        uses: ./.github/workflows/aws-runner.yml
        with:
            cache_tag: ${{ needs.build-environment-ready.outputs.cache_tag }}
            job_matrix: ${{ toJSON(matrix.job_matrix) }}
            task: dispatch

    dispatch-consumers:
        name: ${{ matrix.name }}
        if: ${{ !cancelled() && needs.authorize.outputs.approved == 'true' && needs.build-environment-ready.result == 'success' && needs.dispatch-producers.result == 'success' && needs.build-matrix.outputs.has_consumer == 'true' }}
        needs:
          - authorize
          - build-matrix
          - build-environment-ready
          - dispatch-producers
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix: ${{ fromJSON(needs.build-matrix.outputs.consumer) }}
        uses: ./.github/workflows/aws-runner.yml
        with:
            cache_tag: ${{ needs.build-environment-ready.outputs.cache_tag }}
            job_matrix: ${{ toJSON(matrix.job_matrix) }}
            task: dispatch

    promote-build-environment:
        name: Promote validated build environment
        if: ${{ !cancelled() && needs.authorize.outputs.approved == 'true' && needs.build-environment-ready.result == 'success' && (needs.build-matrix.outputs.has_standalone != 'true' || needs.dispatch-standalone.result == 'success') && (needs.build-matrix.outputs.has_producer != 'true' || needs.dispatch-producers.result == 'success') && (needs.build-matrix.outputs.has_consumer != 'true' || needs.dispatch-consumers.result == 'success') }}
        needs:
          - authorize
          - build-matrix
          - build-environment
          - build-environment-ready
          - dispatch-standalone
          - dispatch-producers
          - dispatch-consumers
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/aws-cache-promotion.yml
        with:
            publish_cache: ${{ needs.authorize.outputs.publish_cache == 'true' }}
            source_tag: ${{ needs.build-environment-ready.outputs.cache_tag }}

    result:
        name: CI result
        if: always()
        needs:
          - authorize
          - infrastructure-contract
          - toolchain-update-state
          - build-matrix
          - build-environment-ready
          - dispatch-standalone
          - dispatch-producers
          - dispatch-consumers
          - promote-build-environment
        runs-on: ubuntu-latest
        timeout-minutes: 5

        steps:
          - name: Report result
            env:
                APPROVED: ${{ needs.authorize.outputs.approved }}
                HAS_CONSUMER: ${{ needs.build-matrix.outputs.has_consumer }}
                HAS_PRODUCER: ${{ needs.build-matrix.outputs.has_producer }}
                HAS_STANDALONE: ${{ needs.build-matrix.outputs.has_standalone }}
                CONSUMER_RESULT: ${{ needs.dispatch-consumers.result }}
                STANDALONE_RESULT: ${{ needs.dispatch-standalone.result }}
                BUILD_ENVIRONMENT_RESULT: ${{ needs.build-environment-ready.result }}
                PRODUCER_RESULT: ${{ needs.dispatch-producers.result }}
                INFRASTRUCTURE_CONTRACT_RESULT: ${{ needs.infrastructure-contract.result }}
                MATRIX_RESULT: ${{ needs.build-matrix.result }}
                PROMOTION_RESULT: ${{ needs.promote-build-environment.result }}
                REASON: ${{ needs.authorize.outputs.reason }}
                TOOLCHAIN_STATE_RESULT: ${{ needs.toolchain-update-state.result }}
            run: |
                if [[ ${APPROVED} != true ]]
                then
                    printf '::error::AWS CI was not authorized: %s\n' "${REASON}"
                    exit 1
                fi

                if [[ ${TOOLCHAIN_STATE_RESULT} != success ]]
                then
                    printf '::error::The toolchain update-state check finished with %s.\n' "${TOOLCHAIN_STATE_RESULT}"
                    exit 1
                fi

                if [[ ${INFRASTRUCTURE_CONTRACT_RESULT} != success ]]
                then
                    printf '::error::Infrastructure contract validation finished with %s.\n' \
                        "${INFRASTRUCTURE_CONTRACT_RESULT}"
                    exit 1
                fi

                if [[ ${MATRIX_RESULT} != success ]]
                then
                    printf '::error::CI matrix compilation finished with %s.\n' \
                        "${MATRIX_RESULT}"
                    exit 1
                fi

                if [[ ${HAS_STANDALONE} != true ]]
                then
                    STANDALONE_RESULT=success
                fi
                if [[ ${HAS_PRODUCER} != true ]]
                then
                    PRODUCER_RESULT=success
                fi
                if [[ ${HAS_CONSUMER} != true ]]
                then
                    CONSUMER_RESULT=success
                fi

                for result in \
                    "build environment:${BUILD_ENVIRONMENT_RESULT}" \
                    "standalone validation:${STANDALONE_RESULT}" \
                    "producer validation:${PRODUCER_RESULT}" \
                    "consumer validation:${CONSUMER_RESULT}" \
                    "cache promotion:${PROMOTION_RESULT}"
                do
                    name=${result%%:*}
                    status=${result#*:}
                    if [[ ${status} != success ]]
                    then
                        printf '::error::%s finished with %s.\n' "${name}" "${status}"
                        failed=true
                    fi
                done

                if [[ ${failed:-false} == true ]]
                then
                    exit 1
                fi
