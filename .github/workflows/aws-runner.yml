name: AWS runner

on:
    workflow_call:
        inputs:
            cache_tag:
                description: Per-run candidate build-environment tag
                required: true
                type: string
            defer_llvm:
                description: Leave an LLVM rebuild for a subsequent large runner
                default: false
                required: false
                type: boolean
            refresh_cache:
                description: Refresh the container operating system
                default: false
                required: false
                type: boolean
            runner_size:
                description: Fixed runner class, either medium or large
                required: true
                type: string
            target:
                description: Architecture or image selected by the caller matrix
                default: ''
                required: false
                type: string
            task:
                description: Work performed by this runner
                required: true
                type: string
        outputs:
            needs_large:
                description: Whether build-environment preparation detected an LLVM rebuild
                value: ${{ jobs.run.outputs.needs_large }}
            ready:
                description: Whether this runner produced the requested candidate environment
                value: ${{ jobs.run.outputs.ready }}

permissions:
    contents: read

jobs:
    provision:
        name: Provision ${{ inputs.runner_size }} runner
        runs-on: ubuntu-latest
        timeout-minutes: 25

        permissions:
            contents: read
            id-token: write

        outputs:
            instance_id: ${{ steps.runner.outputs.instance-id }}
            labels: ${{ steps.runner.outputs.labels }}
            repository_names: ${{ steps.repositories.outputs.names }}

        steps:
          - name: Check out the requested revision
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                repository: ${{ github.repository }}
                ref: ${{ github.sha }}
                persist-credentials: false

          - name: Validate the runner request
            env:
                CACHE_TAG: ${{ inputs.cache_tag }}
                DEFER_LLVM: ${{ inputs.defer_llvm }}
                RUNNER_SIZE: ${{ inputs.runner_size }}
                TARGET: ${{ inputs.target }}
                TASK: ${{ inputs.task }}
            run: |
                set -euo pipefail
                if [[ ! ${CACHE_TAG} =~ ^run-[0-9]+-[0-9]+$ ]]
                then
                    printf 'Invalid cache tag: %s\n' "${CACHE_TAG}" >&2
                    exit 2
                fi
                if [[ ! ${RUNNER_SIZE} =~ ^(medium|large)$ ]]
                then
                    printf 'Invalid runner size: %s\n' "${RUNNER_SIZE}" >&2
                    exit 2
                fi
                if [[ ! ${TARGET} =~ ^[a-z0-9-]*$ ]]
                then
                    printf 'Invalid matrix target: %s\n' "${TARGET}" >&2
                    exit 2
                fi

                case ${TASK} in
                    prepare)
                        [[ -z ${TARGET} ]]
                        ;;
                    build-dependencies|unit-tests|image|boot)
                        [[ -n ${TARGET} && ${RUNNER_SIZE} == medium && ${DEFER_LLVM} == false ]]
                        ;;
                    *)
                        printf 'Invalid runner task: %s\n' "${TASK}" >&2
                        exit 2
                        ;;
                esac

          - name: Launch the JIT runner
            id: runner
            uses: reaver-project/infrastructure/actions/ephemeral-runner@c6a0fad8e1d37e9316ee97dff058aa367795966d
            with:
                aws-region: ${{ vars.AWS_REGION }}
                control-function-output: ${{ github.ref == 'refs/heads/main' && 'TrustedRunnerControlFunctionName' || 'RunnerControlFunctionName' }}
                expected-contract-version: '5'
                operation: launch
                role-arn: ${{ github.ref == 'refs/heads/main' && vars.AWS_TRUSTED_RUNNER_ROLE_ARN || vars.AWS_RUNNER_ROLE_ARN }}
                runner-key: ${{ inputs.target == '' && inputs.task || format('{0}-{1}', inputs.task, inputs.target) }}
                runner-profile: ${{ inputs.task == 'prepare' && 'builder' || 'validation' }}
                runner-size: ${{ inputs.runner_size }}
                stack-name: ${{ vars.AWS_RUNNER_STACK_NAME }}

          - name: Pass repository names to the runner
            id: repositories
            env:
                AWS_REGION: ${{ vars.AWS_REGION }}
                STACK_OUTPUTS: ${{ steps.runner.outputs.stack-outputs }}
            run: |
                set -euo pipefail
                names=$(./ci/aws/strip-ecr-registry "${AWS_REGION}" <<< "${STACK_OUTPUTS}")
                printf 'names=%s\n' "${names}" >> "${GITHUB_OUTPUT}"

    run:
        name: Run ${{ inputs.task }} ${{ inputs.target }}
        needs: provision
        runs-on: ${{ fromJSON(needs.provision.outputs.labels) }}
        timeout-minutes: 240

        permissions:
            contents: read

        outputs:
            needs_large: ${{ steps.prepare.outputs.needs_large }}
            ready: ${{ steps.prepare.outputs.ready }}

        env:
            AWS_REGION: ${{ vars.AWS_REGION }}

        steps:
          - name: Check out the requested revision
            uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
            with:
                repository: ${{ github.repository }}
                ref: ${{ github.sha }}
                persist-credentials: false

          - name: Configure the host compiler cache
            if: inputs.task == 'prepare'
            uses: reaver-project/infrastructure/actions/compiler-cache@c6a0fad8e1d37e9316ee97dff058aa367795966d
            with:
                aws-region: ${{ vars.AWS_REGION }}
                project-slug: reaveros
                stack-name: ${{ vars.AWS_RUNNER_STACK_NAME }}

          - name: Configure the build-environment cache
            if: inputs.task != 'boot'
            env:
                CACHE_TAG: ${{ inputs.cache_tag }}
                REPOSITORY_NAMES: ${{ needs.provision.outputs.repository_names }}
                TASK: ${{ inputs.task }}
            run: |
                set -euo pipefail
                account_id=$(aws sts get-caller-identity --query Account --output text)
                if [[ ! ${account_id} =~ ^[0-9]{12}$ ]]
                then
                    printf 'Runner has no valid AWS account identity.\n' >&2
                    exit 1
                fi
                registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
                repository_list=$(jq --exit-status --raw-output '
                    [ .BuildEnvironmentRepositoryUri,
                      .UnprunedBuildEnvironmentRepositoryUri,
                      .CandidateBuildEnvironmentRepositoryUri,
                      .CandidateUnprunedBuildEnvironmentRepositoryUri,
                      .StagingBuildEnvironmentRepositoryUri,
                      .StagingUnprunedBuildEnvironmentRepositoryUri ] | @tsv
                ' <<< "${REPOSITORY_NAMES}")
                IFS=$'\t' read -r build_repository unpruned_repository \
                    candidate_repository candidate_unpruned_repository \
                    staging_repository staging_unpruned_repository <<< "${repository_list}"
                BUILD_ENVIRONMENT="${registry}/${build_repository}"
                UNPRUNED_BUILD_ENVIRONMENT="${registry}/${unpruned_repository}"
                CANDIDATE_BUILD_ENVIRONMENT="${registry}/${candidate_repository}"
                CANDIDATE_UNPRUNED_BUILD_ENVIRONMENT="${registry}/${candidate_unpruned_repository}"
                STAGING_BUILD_ENVIRONMENT="${registry}/${staging_repository}"
                STAGING_UNPRUNED_BUILD_ENVIRONMENT="${registry}/${staging_unpruned_repository}"
                aws ecr get-login-password --region "${AWS_REGION}" \
                    | docker login --username AWS --password-stdin "${registry}"

                if [[ ${TASK} == prepare ]]
                then
                    toolchain_key=$(./docker/toolchain-key)
                    {
                        printf 'REAVEROS_BUILD_ENV_IMAGE=%s\n' "${STAGING_BUILD_ENVIRONMENT}"
                        printf 'REAVEROS_BUILD_ENV_UNPRUNED_IMAGE=%s\n' "${STAGING_UNPRUNED_BUILD_ENVIRONMENT}"
                        printf 'REAVEROS_BUILD_ENV_SEED_IMAGE=%s\n' "${BUILD_ENVIRONMENT}"
                        printf 'REAVEROS_BUILD_ENV_SEED_UNPRUNED_IMAGE=%s\n' "${UNPRUNED_BUILD_ENVIRONMENT}"
                        printf 'REAVEROS_BUILD_ENV_FALLBACK_IMAGE=%s\n' "${CANDIDATE_BUILD_ENVIRONMENT}"
                        printf 'REAVEROS_BUILD_ENV_FALLBACK_UNPRUNED_IMAGE=%s\n' "${CANDIDATE_UNPRUNED_BUILD_ENVIRONMENT}"
                        printf 'REAVEROS_BUILD_ENV_SEED_TAG=%s\n' "${toolchain_key}"
                        printf 'REAVEROS_BUILD_ENV_TAG=%s\n' "${CACHE_TAG}"
                    } >> "${GITHUB_ENV}"
                else
                    image="${STAGING_BUILD_ENVIRONMENT}:${CACHE_TAG}"
                    docker pull "${image}"
                    printf 'BUILD_ENVIRONMENT_IMAGE=%s\n' "${image}" >> "${GITHUB_ENV}"
                fi

          - name: Prepare the candidate build environment
            id: prepare
            if: inputs.task == 'prepare'
            env:
                DEFER_LLVM: ${{ inputs.defer_llvm }}
                REFRESH_CACHE: ${{ inputs.refresh_cache }}
            run: |
                set -euo pipefail
                arguments=()
                if [[ ${DEFER_LLVM} == true ]]
                then
                    arguments+=(--defer-llvm)
                fi
                if [[ ${REFRESH_CACHE} == true ]]
                then
                    arguments+=(--refresh)
                fi

                ./docker/update-images "${arguments[@]}"
                if [[ $(awk -F= '/^ready=/{ print $2 }' "${GITHUB_OUTPUT}" | tail -n1) == true ]]
                then
                    docker push "$(./docker/image-ref pruned)"
                    docker push "$(./docker/image-ref unpruned)"
                fi

          - name: Report compiler-cache use
            if: always() && inputs.task == 'prepare'
            env:
                SCCACHE_SERVER_UDS: ${{ env.REAVER_PROJECT_SCCACHE_HOST_SOCKET }}
            run: |
                if [[ -n ${SCCACHE_SERVER_UDS:-} && -S ${SCCACHE_SERVER_UDS} ]]
                then
                    "${REAVER_PROJECT_SCCACHE_HOST_DIR}/sccache" --show-stats
                fi

          - name: Check build-system dependencies
            if: inputs.task == 'build-dependencies'
            run: ./ci/check-build-dependencies '${{ inputs.target }}' "${BUILD_ENVIRONMENT_IMAGE}"

          - name: Run unit tests
            if: inputs.task == 'unit-tests'
            run: ./ci/run-unit-tests '${{ inputs.target }}' "${BUILD_ENVIRONMENT_IMAGE}"

          - name: Build image
            if: inputs.task == 'image'
            run: ./ci/build-image '${{ inputs.target }}' "${BUILD_ENVIRONMENT_IMAGE}" artifacts

          - name: Upload image
            if: inputs.task == 'image'
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
            with:
                name: image-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
                path: artifacts/${{ inputs.target }}.img
                if-no-files-found: error
                retention-days: 7

          - name: Download image
            if: inputs.task == 'boot'
            uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
            with:
                name: image-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
                path: artifacts

          - name: Smoke-test image
            if: inputs.task == 'boot'
            run: ./ci/smoke-test-uefi-amd64 "artifacts/${{ inputs.target }}.img" "artifacts/${{ inputs.target }}.serial.log"

          - name: Upload serial log
            if: always() && inputs.task == 'boot'
            uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
            with:
                name: serial-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
                path: artifacts/${{ inputs.target }}.serial.log
                if-no-files-found: warn
                retention-days: 7

    cleanup:
        name: Terminate ephemeral runner
        if: always() && needs.provision.outputs.instance_id != ''
        needs:
          - provision
          - run
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            contents: read
            id-token: write

        steps:
          - name: Terminate the runner
            uses: reaver-project/infrastructure/actions/ephemeral-runner@c6a0fad8e1d37e9316ee97dff058aa367795966d
            with:
                aws-region: ${{ vars.AWS_REGION }}
                control-function-output: ${{ github.ref == 'refs/heads/main' && 'TrustedRunnerControlFunctionName' || 'RunnerControlFunctionName' }}
                instance-id: ${{ needs.provision.outputs.instance_id }}
                operation: terminate
                role-arn: ${{ github.ref == 'refs/heads/main' && vars.AWS_TRUSTED_RUNNER_ROLE_ARN || vars.AWS_RUNNER_ROLE_ARN }}
                stack-name: ${{ vars.AWS_RUNNER_STACK_NAME }}
