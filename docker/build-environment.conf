# ECR vulnerability scanning requires a supported, versioned Debian release.
reaveros_build_environment_release=trixie
reaveros_build_environment_base_image=debian:${reaveros_build_environment_release}

reaveros_build_environment_packages=(
    automake
    bison
    build-essential
    ccache
    cmake
    cpio
    flex
    git
    libssl-dev
    python3
    xz-utils
)

reaveros_build_environment_backports_packages=(
    libcurl3t64-gnutls
    libcurl4t64
)
